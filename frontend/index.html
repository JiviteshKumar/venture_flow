    <title>VentureFlow</title>

    <!--
      ONE TYPEFACE.

      Inter, and nothing else. The product previously ran three families at
      once -- Instrument Serif for display, Inter for interface, JetBrains Mono
      for figures -- and however carefully each was used, three voices on one
      screen read as three products stitched together.

      Inter carries all three jobs because it was drawn for exactly this range:
      a very large weight and optical span for display type, a interface face
      designed at small sizes, and `tnum` tabular figures so a column of
      numbers stays in column as the values change. Display sizes get tight
      negative tracking and data gets `tnum` + slashed zero, which is how one
      family does three jobs without sounding like three.

      Only the weights actually used are requested. Asking for a full family is
      how a font block becomes 400KB.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
