<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VentureFlow</title>

    <!--
      Fonts are loaded here, not with a CSS `@import`.

      The same `@import url(...)` line was duplicated inside <style> blocks in
      four components (Sidebar, Analysis, Dashboard, UploadDeck). A CSS
      @import cannot begin downloading until the stylesheet containing it has
      itself been downloaded and parsed, so it serialises the font request
      behind the CSS -- and because these blocks were rendered by React, the
      request did not even start until after hydration. Moving them here lets
      the browser start both connections during the initial HTML parse.

      Two families only: DM Serif Display for headline numerals and titles,
      IBM Plex Mono for every data value and label. Figtree was a third face
      used for body copy and is dropped in favour of the system UI stack,
      which removes a render-blocking download for text that is not
      brand-critical.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
